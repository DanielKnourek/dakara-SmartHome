  - Group: root

  - Supplementary Groups: apps

x-portals:
  - host: kino.dakara.stream
    name: Open Jellyfin
    path: /
    port: 443
    scheme: https
  - host: 0.0.0.0
    name: X-local
    path: /
    port: 8096
    scheme: http