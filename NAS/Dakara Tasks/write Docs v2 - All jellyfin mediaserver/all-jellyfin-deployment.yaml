---
version: "3.3"
services:
  gluetun:
    container_name: GlueTun-VPN
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    ports:
      - 8088:8088
      - 51820:51820
      - 51820:51820/udp
      - 46931:46931
      - 46931:46931/udp
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${"op://Private/5jdug5dtjs63g2oe7vlbcyv5ey/Mulvad key/WIREGUARD PRIVATE KEY"}
      - WIREGUARD_ADDRESSES=10.68.216.136/32
      - SERVER_CITIES=Amsterdam
      - VPN_PORT_FORWARDING=off 
      - TZ=Europe/Prague
      - UPDATER_PERIOD=24h
    restart: always
    volumes:
      - /mnt/ssd-data0/app-data/jellyfin-plus:/mnt/ssd-data0/app-data/jellyfin-plus
      - /mnt/ssd-data0/app-data/jellyfin-plus/gluetun:/tmp/gluetun
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    container_name: qbittorrent
    depends_on:
      - gluetun
    environment:
      - WEBUI_PORT=8088
      - PUID=0
      - PGID=0
      - TZ=Europe/Prague
      #- DOCKER_MODS=ghcr.io/gabe565/linuxserver-mod-vuetorrent
    volumes:
      - /mnt/ssd-data0/app-data/jellyfin-plus:/mnt/ssd-data0/app-data/jellyfin-plus
      - /mnt/ssd-data0/app-data/jellyfin-plus/configs/qbittorrent:/config
      - /mnt/ssd-data0/app-data/jellyfin-plus/qbittorrent/downloads:/downloads
    restart: unless-stopped
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/Prague
      #- LANG=fr_FR
      #- LANG=en_US
    ports:
      - 8191:8191
    restart: unless-stopped
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Prague
    volumes:
      - /mnt/ssd-data0/app-data/jellyfin-plus/configs/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Prague
    volumes:
      - /mnt/ssd-data0/app-data/jellyfin-plus/configs/jackett:/config
    ports:
      - 9117:9117
    restart: unless-stopped
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Prague
    volumes:
      - /mnt/ssd-data0/app-data/jellyfin-plus:/mnt/ssd-data0/app-data/jellyfin-plus
      - /mnt/ssd-data0/app-data/jellyfin-plus/configs/sonarr:/config
      - /mnt/ssd-data0/app-data/jellyfin-plus/sonarr/tv:/tv
      - /mnt/ssd-data0/app-data/jellyfin-plus/qbittorrent/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Prague
    volumes:
      - /mnt/ssd-data0/app-data/jellyfin-plus:/mnt/ssd-data0/app-data/jellyfin-plus
      - /mnt/ssd-data0/app-data/jellyfin-plus/configs/radarr:/config
      - /mnt/ssd-data0/app-data/jellyfin-plus/radarr/movies:/movies
      - /mnt/ssd-data0/app-data/jellyfin-plus/qbittorrent/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Prague
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    volumes:
      - /mnt/ssd-data0/app-data/jellyfin-plus:/mnt/ssd-data0/app-data/jellyfin-plus
      - /mnt/ssd-data0/app-data/jellyfin-plus/configs/jellyfin:/config
      - /mnt/ssd-data0/app-data/jellyfin-plus/jellyfin/cache:/cache
      - /mnt/ssd-data0/app-data/jellyfin-plus/sonarr/tv:/data/tvshows
      - /mnt/ssd-data0/app-data/jellyfin-plus/radarr/movies:/data/movies
      - /mnt/ssd-data0/app-data/jellyfin-plus/qbittorrent/downloads:/data/media_downloads
    restart: unless-stopped
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=Europe/Prague
    ports:
      - 5055:5055
    volumes:
      - /mnt/ssd-data0/app-data/jellyfin-plus/configs/jellyseerr:/app/config
    restart: unless-stopped