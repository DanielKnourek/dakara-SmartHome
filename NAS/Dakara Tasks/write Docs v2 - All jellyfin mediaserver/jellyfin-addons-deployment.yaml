  - host: torrent.dakara.stream
    name: 03. qBittorrent
    path: /
    port: 443
    scheme: https
  - host: sonarr.dakara.stream
    name: 04. Sonarr (TV)
    path: /
    port: 443
    scheme: https
  - host: radarr.dakara.stream
    name: 05. Radarr (Movies)
    path: /
    port: 443
    scheme: https
  - host: prowlarr.dakara.stream
    name: 06. Prowlarr (Indexers)
